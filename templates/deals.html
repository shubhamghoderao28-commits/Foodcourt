{% extends "base.html" %}
{% block title %}Deals & Offers{% endblock %}
{% block content %}
<section class="page-intro">
  <p class="eyebrow">SAVE ON YOUR NEXT BITE</p>
  <h1>Deals & Offers</h1>
  <p>This page loads offers dynamically from the Flask API at <code>/api/offers</code>.</p>
</section>

<section style="margin:24px 0">
  <form id="offer-filter" style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
    <label for="min-order">Minimum order value (₹)</label>
    <input id="min-order" type="number" min="0" value="0"
           style="padding:11px;border:1px solid #ddd;border-radius:8px;width:150px">
    <button type="submit" class="btn">Filter offers</button>
  </form>
</section>

<p id="offers-status" role="status">Loading offers...</p>
<section id="offers-list" class="food-grid" aria-live="polite"></section>

<script>
const offersStatus = document.getElementById("offers-status");
const offersList = document.getElementById("offers-list");
const minOrderInput = document.getElementById("min-order");

async function loadOffers() {
  offersStatus.textContent = "Loading offers...";
  offersList.replaceChildren();

  const minOrder = Number(minOrderInput.value || 0);
  if (!Number.isInteger(minOrder) || minOrder < 0) {
    offersStatus.textContent = "Enter a valid non-negative minimum order value.";
    return;
  }

  try {
    const response = await fetch(`/api/offers?min_order=${encodeURIComponent(minOrder)}`);
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || "Could not load offers");

    if (data.offers.length === 0) {
      offersStatus.textContent = "No offers match this filter.";
      return;
    }

    offersStatus.textContent = `${data.count} offer(s) available.`;

    for (const offer of data.offers) {
      const card = document.createElement("article");
      card.className = "food-card";
      card.style.padding = "20px";

      const category = document.createElement("span");
      category.className = "category";
      category.textContent = offer.category;

      const title = document.createElement("h3");
      title.textContent = offer.title;

      const description = document.createElement("p");
      description.textContent = offer.description;

      const code = document.createElement("strong");
      code.textContent = `Code: ${offer.code}`;
      code.style.cssText = "display:inline-block;background:#e7f2bd;color:#174c35;padding:8px 10px;border-radius:8px";

      const minimum = document.createElement("p");
      minimum.textContent = `Minimum order: ₹${offer.minimum_order}`;

      const detailsButton = document.createElement("button");
      detailsButton.type = "button";
      detailsButton.className = "small-btn";
      detailsButton.textContent = "View API JSON";
      detailsButton.style.marginTop = "12px";
      detailsButton.addEventListener("click", () => showOfferDetails(offer.code));

      card.append(category, title, description, code, minimum, detailsButton);
      offersList.append(card);
    }
  } catch (error) {
    offersStatus.textContent = `Error: ${error.message}`;
  }
}

async function showOfferDetails(code) {
  try {
    const response = await fetch(`/api/offers/${encodeURIComponent(code)}`);
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || "Could not load offer");
    alert(JSON.stringify(data, null, 2));
  } catch (error) {
    alert(error.message);
  }
}

document.getElementById("offer-filter").addEventListener("submit", event => {
  event.preventDefault();
  loadOffers();
});

loadOffers();
</script>
{% endblock %}
